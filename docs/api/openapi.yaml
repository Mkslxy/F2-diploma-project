openapi: 3.0.3
info:
  title: MedCenter Distributed Healthcare API
  description: >-
    Специфікація міжсервісних REST-контрактів інформаційно-аналітичної системи
    управління медичним центром (Frontend Next.js SPA <-> Backend Django DRF Core API).
    Реалізує вимоги SRS-FUN-01..08 та архітектурне рішення ADR-001 (Redis Soft Lock TTL 420 с + PostgreSQL SELECT FOR UPDATE).
  version: 1.1.0
  contact:
    name: Petychachnyi Olexii (F2-diploma-project)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.medcenter.local/api/v1
    description: Production API Gateway (Nginx TLS 1.3)

tags:
  - name: Auth
    description: Автентифікація та видача асиметричних JWT (RS256)
  - name: Schedule
    description: Пошук та тимчасове блокування часових слотів (Hold Slot)
  - name: Appointments
    description: Транзакційне створення прийомів та керування статусами FSM
  - name: Analytics
    description: Асинхронно агрегована аналітика завантаженості спеціалістів

paths:
  /auth/token:
    post:
      tags: [Auth]
      summary: Автентифікація користувача та генерація JWT-пари
      description: >-
        Перевіряє облікові дані за алгоритмом Argon2id. Повертає короткоживучий Access JWT (RS256, 15 хв)
        у тілі відповіді та встановлює Refresh-токен (7 днів) у захищеній httpOnly/Secure/SameSite=Strict cookie.
        Обмежено Rate Limiting 10 req/min на IP.
      operationId: obtainAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
      responses:
        '200':
          description: Успішна автентифікація
          headers:
            Set-Cookie:
              description: Refresh JWT у захищеній httpOnly cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /schedule/slots:
    get:
      tags: [Schedule]
      summary: Отримання списку часових слотів спеціалістів із пагінацією
      description: >-
        Повертає сторінку часових слотів із фільтрацією за doctor_id та діапазоном дат.
        Використовує складений B-Tree індекс idx_slots_doctor_range (SRS-NFR-PERF-01: p95 <= 120 мс).
      operationId: getScheduleSlots
      security:
        - BearerAuth: []
      parameters:
        - name: doctor_id
          in: query
          required: false
          description: UUID спеціаліста для фільтрації розкладу
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          required: true
          description: Початкова дата діапазону (ISO-8601)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          description: Кінцева дата діапазону (ISO-8601)
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          description: Номер сторінки вибірки
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Кількість записів на сторінку (максимум 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Успішне отримання сторінки слотів розкладу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScheduleSlots'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /schedule/slots/{id}/hold:
    post:
      tags: [Schedule]
      summary: Тимчасове атомарне резервування слота (Soft Lock у Redis)
      description: >-
        Встановлює атомарний ключ блокування в Redis (SET slot:{id}:hold patient_id NX EX 420)
        на 420 секунд (7 хвилин) відповідно до ADR-001 та SRS-FUN-02.
      operationId: holdScheduleSlot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID часового слота
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldSlotRequest'
      responses:
        '200':
          description: Слот успішно зарезервовано на 420 секунд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldSlotResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Конфлікт — слот уже зарезервовано або заброньовано іншим користувачем
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'

  /appointments:
    post:
      tags: [Appointments]
      summary: Транзакційне підтвердження запису на прийом (Hard Lock у PostgreSQL)
      description: >-
        Перевіряє власника Soft Lock у Redis та фіксує прийом у PostgreSQL у межах
        транзакції READ COMMITTED з песимістичним блокуванням SELECT ... FOR UPDATE (SRS-FUN-04).
      operationId: createAppointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Запис на прийом успішно зафіксовано в БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          description: Термін утримання слота закінчився або слот зайнято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Зміна статусу прийому за скінченним автоматом (FSM)
      description: >-
        Виконує валідований перехід статусу прийому (SCHEDULED -> IN_PROGRESS -> COMPLETED / CANCELLED),
        фіксує подію в AUDIT_LOGS та ініціює асинхронний перерахунок завантаженості в Celery (SRS-FUN-05).
        Перевіряє права доступу та захист від IDOR/BOLA.
      operationId: updateAppointmentStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID запису на прийом
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentStatusRequest'
      responses:
        '200':
          description: Статус прийому успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Неприпустимий перехід статусу в скінченному автоматі (FSM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

  /analytics/workload:
    get:
      tags: [Analytics]
      summary: Отримання агрегованої аналітики завантаженості спеціалістів
      description: >-
        Повертає попередньо розраховані воркером Celery метрики утилізації робочого часу з кешу Redis
        (TTL 1800 с) або з таблиці WORKLOAD_METRICS із пагінацією (SRS-FUN-06, SRS-NFR-PERF-03 <= 50 мс із кешу).
        Доступно лише ролям ClinicManager та Doctor (для власних даних).
      operationId: getWorkloadAnalytics
      security:
        - BearerAuth: []
      parameters:
        - name: doctor_id
          in: query
          required: false
          description: UUID лікаря (опційно; за замовчуванням усі активні лікарі для ClinicManager)
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Агрегована вибірка метрик завантаженості
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkloadMetrics'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SlotStatus:
      type: string
      enum: [FREE, ON_HOLD, BOOKED, CANCELLED]

    AppointmentStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]

    TokenObtainRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    TokenObtainResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          example: 900

    HoldSlotRequest:
      type: object
      additionalProperties: false
      required:
        - patient_id
      properties:
        patient_id:
          type: string
          format: uuid

    HoldSlotResponse:
      type: object
      required:
        - slot_id
        - status
        - hold_expires_at
        - ttl_seconds
      properties:
        slot_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SlotStatus'
        hold_expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 420
          example: 420

    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required:
        - slot_id
        - patient_id
        - visit_reason
      properties:
        slot_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        visit_reason:
          type: string
          minLength: 5
          maxLength: 500
          pattern: '^[^\x00-\x1F]+$'

    UpdateAppointmentStatusRequest:
      type: object
      additionalProperties: false
      required:
        - new_status
      properties:
        new_status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]
        medical_notes:
          type: string
          maxLength: 2000

    ScheduleSlot:
      type: object
      required:
        - id
        - doctor_id
        - start_time
        - end_time
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Appointment:
      type: object
      required:
        - id
        - slot_id
        - patient_id
        - doctor_id
        - status
        - visit_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slot_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
          description: Проєкція doctor_id з пов'язаного запису SCHEDULE_SLOTS (3NF)
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        visit_reason:
          type: string
        medical_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkloadMetric:
      type: object
      required:
        - id
        - doctor_id
        - report_date
        - utilization_rate
        - total_booked_minutes
        - total_available_minutes
        - idle_minutes
        - calculated_at
      properties:
        id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        report_date:
          type: string
          format: date
        utilization_rate:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
        total_booked_minutes:
          type: integer
          minimum: 0
        total_available_minutes:
          type: integer
          minimum: 0
        idle_minutes:
          type: integer
          minimum: 0
        calculated_at:
          type: string
          format: date-time

    PaginatedScheduleSlots:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlot'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100

    PaginatedWorkloadMetrics:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadMetric'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    400BadRequest:
      description: Помилка валідації вхідних параметрів або DTO
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Відсутній, протермінований або невалідний JWT-токен (RS256)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Недостатньо прав RBAC або порушення політики володіння ресурсом (IDOR/BOLA)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Запитаний ресурс не знайдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429TooManyRequests:
      description: Перевищено ліміт запитів (Rate Limiting 100 req/min або 10 req/min для auth)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalError:
      description: Внутрішня помилка сервера або транзакційний збій СУБД
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ServiceUnavailable:
      description: Тимчасова недоступність Redis або зовнішнього інтеграційного шлюзу
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
